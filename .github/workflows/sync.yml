name: Cozy Feed Crawl Data

on:
  schedule:
    - cron: "0 */3 * * *" # Chạy cào tin mỗi 3 tiếng
  workflow_dispatch: # Kích hoạt thủ công từ tab Actions với tùy chọn
    inputs:
      source:
        description: "Tên nguồn tin muốn cào riêng (để trống để cào tất cả, ví dụ: dantri)"
        required: false
        default: ""
      force:
        description: "Bắt buộc cào lại từ đầu (-f)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  crawl-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Scraper Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            ARGS="$ARGS ${{ github.event.inputs.source }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS -f"
          fi
          echo "Running sync with args: $ARGS"
          deno task sync $ARGS
